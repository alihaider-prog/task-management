openapi: 3.0.3
info:
  title: Task Management API
  version: 1.0.0
  description: Task management REST API for workspaces, projects, tasks, and membership.
servers:
  - url: http://localhost:8080/api/v1
tags:
  - name: Auth
    description: Authentication endpoints (register/login)
  - name: Workspaces
    description: Workspace management endpoints
  - name: Workspace Members
    description: Manage members of a workspace
  - name: Projects
    description: Project management endpoints
  - name: Project Members
    description: Manage members of a project
  - name: Tasks
    description: Task management endpoints
  - name: Task History
    description: Task history and audit entries
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    AuthResponse:
      type: object
      properties:
        token:
          type: string
    Workspace:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        owner_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Project:
      type: object
      properties:
        id:
          type: integer
        workspace_id:
          type: integer
        name:
          type: string
        description:
          type: string
        status:
          type: string
        priority:
          type: string
        due_date:
          type: string
          format: date
        created_by:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Task:
      type: object
      properties:
        id:
          type: integer
        project_id:
          type: integer
        title:
          type: string
        description:
          type: string
        status:
          type: string
        priority:
          type: string
        due_date:
          type: string
          format: date
        assignee_id:
          type: integer
          nullable: true
        parent_task_id:
          type: integer
          nullable: true
        created_by:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WorkspaceMember:
      type: object
      properties:
        id:
          type: integer
        workspace_id:
          type: integer
        user_id:
          type: integer
        role:
          type: string
          enum:
            - admin
            - member
            - viewer
        created_at:
          type: string
          format: date-time
    ProjectMember:
      type: object
      properties:
        id:
          type: integer
        project_id:
          type: integer
        user_id:
          type: integer
        created_at:
          type: string
          format: date-time
    TaskHistory:
      type: object
      properties:
        id:
          type: integer
        task_id:
          type: integer
        changed_by:
          type: integer
          nullable: true
        action:
          type: string
          enum:
            - create
            - update
            - delete
            - status_change
        field_name:
          type: string
          nullable: true
        old_value:
          type: string
          nullable: true
        new_value:
          type: string
          nullable: true
        old_status:
          type: string
          enum:
            - todo
            - in_progress
            - completed
            - overdue
        new_status:
          type: string
          enum:
            - todo
            - in_progress
            - completed
            - overdue
        old_priority:
          type: string
          enum:
            - low
            - medium
            - high
            - urgent
        new_priority:
          type: string
          enum:
            - low
            - medium
            - high
            - urgent
        old_assignee_id:
          type: integer
          nullable: true
        new_assignee_id:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid input
  /auth/login:
    post:
      tags:
        - Auth
      summary: Login and receive a JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
  /workspaces:
    get:
      tags:
        - Workspaces
      summary: List workspaces
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of workspaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'
    post:
      tags:
        - Workspaces
      summary: Create a workspace
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Workspace created
  /workspaces/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags:
        - Workspaces
      summary: Get a workspace by ID
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Workspace details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
    put:
      tags:
        - Workspaces
      summary: Update a workspace
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Workspace updated
    delete:
      tags:
        - Workspaces
      summary: Delete a workspace
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Workspace deleted
  /workspaces/{id}/members:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags:
        - Workspace Members
      summary: List workspace members
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of workspace members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceMember'
    post:
      tags:
        - Workspace Members
      summary: Add a workspace member
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - role
              properties:
                user_id:
                  type: integer
                role:
                  type: string
                  enum:
                    - admin
                    - member
                    - viewer
      responses:
        '201':
          description: Workspace member added
  /workspaces/{id}/members/{memberId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: memberId
        in: path
        required: true
        schema:
          type: integer
    delete:
      tags:
        - Workspace Members
      summary: Remove a workspace member
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Workspace member removed
  /workspace/{id}/projects:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags:
        - Projects
      summary: List projects in a workspace
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
    post:
      tags:
        - Projects
      summary: Create a project in a workspace
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Project created
  /projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags:
        - Projects
      summary: Get a project
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
    put:
      tags:
        - Projects
      summary: Update a project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                status:
                  type: string
                priority:
                  type: string
                due_date:
                  type: string
                  format: date
      responses:
        '200':
          description: Project updated
    delete:
      tags:
        - Projects
      summary: Delete a project
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Project deleted
  /projects/{id}/members:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags:
        - Project Members
      summary: List project members
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of project members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectMember'
    post:
      tags:
        - Project Members
      summary: Add a project member
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
              properties:
                user_id:
                  type: integer
      responses:
        '201':
          description: Project member added
  /projects/{id}/members/{memberId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: memberId
        in: path
        required: true
        schema:
          type: integer
    delete:
      tags:
        - Project Members
      summary: Remove a project member
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Project member removed
  /projects/{id}/tasks:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags:
        - Tasks
      summary: List tasks for a project
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
  /tasks:
    post:
      tags:
        - Tasks
      summary: Create a task
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
      responses:
        '201':
          description: Task created
  /tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags:
        - Tasks
      summary: Get a task
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
    put:
      tags:
        - Tasks
      summary: Update a task
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
      responses:
        '200':
          description: Task updated
    delete:
      tags:
        - Tasks
      summary: Delete a task
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Task deleted

  /tasks/{id}/history:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags:
        - Task History
      summary: Get task history
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Task history entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskHistory'
        '404':
          description: Task not found
